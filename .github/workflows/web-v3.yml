name: Build and deploy Flutter Web v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply vehicle form patch from stable commit
        working-directory: mobile
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          old = subprocess.check_output(['git','show','ad55f01d8de57afa90772591a782e839c68b2c9e:.github/workflows/web.yml'], text=True)
          script = old.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          exec(textwrap.dedent(script), {})
          PY

      - name: Apply record management patch
        working-directory: mobile
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          wf = subprocess.check_output(['git','show','HEAD:.github/workflows/web-v2.yml'], text=True)
          block = wf.split("- name: Patch record edit and delete",1)[1]
          script = block.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          exec(textwrap.dedent(script), {})
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Set Flutter base href placeholder
        run: sed -i 's|<base href="[^"]*">|<base href="$FLUTTER_BASE_HREF">|' web/index.html
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - name: Build Flutter Web
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL="https://api-khodro.mtnikmaram.ir/api/v1"
        working-directory: mobile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
