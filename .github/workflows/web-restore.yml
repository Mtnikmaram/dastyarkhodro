name: Restore and deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-restore
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
      - name: Prepare Flutter web
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release --base-href / --dart-define=API_BASE_URL="https://api-khodro.mtnikmaram.ir/api/v1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
