name: Build and deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('mobile/lib/main.dart')
          s = p.read_text()

          if "import 'car_catalog.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'car_catalog.dart';", 1)

          s = s.replace("  return out.toString();\n}\n\nString fuelName", "  return out.toString();\n}\n\nint? parseFlexibleInt(String value) {\n  final normalized = normalizeDigits(value).replaceAll(RegExp(r'[\\s,،٬]'), '').trim();\n  return int.tryParse(normalized);\n}\n\nString fuelName", 1)

          new_add_vehicle = r'''class AddVehicle extends StatefulWidget {
  const AddVehicle({super.key, required this.api});
  final ApiClient api;
  @override State<AddVehicle> createState() => _AddVehicleState();
}

class _AddVehicleState extends State<AddVehicle> {
  final nick = TextEditingController();
  final make = TextEditingController();
  final model = TextEditingController();
  final year = TextEditingController();
  final odo = TextEditingController();
  String fuel = 'petrol';
  String transmission = 'manual';
  bool busy = false;

  void msg(String text) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(text)));

  List<String> brandOptions(String query) {
    final q = query.trim().toLowerCase();
    final all = catalogBrands();
    if (q.isEmpty) return all;
    return all.where((x) => x.toLowerCase().contains(q)).toList();
  }

  List<String> modelOptions(String query) {
    final q = query.trim().toLowerCase();
    final all = catalogModelsFor(make.text.trim());
    if (q.isEmpty) return all;
    return all.where((x) => x.toLowerCase().contains(q)).toList();
  }

  Widget searchableField({
    required TextEditingController controller,
    required String label,
    required IconData icon,
    required List<String> Function(String) options,
    required void Function(String) onChanged,
    void Function(String)? onSelected,
  }) {
    return Autocomplete<String>(
      optionsBuilder: (value) => options(value.text),
      displayStringForOption: (option) => option,
      onSelected: (value) {
        controller.text = value;
        controller.selection = TextSelection.collapsed(offset: value.length);
        onSelected?.call(value);
      },
      fieldViewBuilder: (context, textController, focusNode, onFieldSubmitted) {
        if (textController.text != controller.text) {
          textController.value = controller.value;
        }
        return TextField(
          controller: textController,
          focusNode: focusNode,
          onChanged: (value) {
            controller.value = textController.value;
            onChanged(value);
          },
          decoration: deco(label, icon).copyWith(
            suffixIcon: const Icon(Icons.search),
          ),
        );
      },
      optionsViewBuilder: (context, onSelected, options) {
        return Align(
          alignment: Alignment.topRight,
          child: Material(
            elevation: 8,
            borderRadius: BorderRadius.circular(12),
            child: ConstrainedBox(
              constraints: const BoxConstraints(maxHeight: 260, minWidth: 280),
              child: ListView.builder(
                padding: const EdgeInsets.symmetric(vertical: 6),
                shrinkWrap: true,
                itemCount: options.length,
                itemBuilder: (context, index) {
                  final option = options.elementAt(index);
                  return ListTile(
                    dense: true,
                    title: Align(alignment: Alignment.centerRight, child: Text(option)),
                    onTap: () => onSelected(option),
                  );
                },
              ),
            ),
          ),
        );
      },
    );
  }

  Future<void> save() async {
    final odometer = parseFlexibleInt(odo.text);
    final buildYear = parseFlexibleInt(year.text);
    final brand = make.text.trim();
    final selectedModel = model.text.trim();

    if (nick.text.trim().isEmpty || brand.isEmpty || selectedModel.isEmpty || odometer == null) {
      msg('نام خودرو، برند، مدل و کیلومتر الزامی است.');
      return;
    }
    if (year.text.trim().isNotEmpty && buildYear == null) {
      msg('سال ساخت را به صورت عدد وارد کن.');
      return;
    }
    if (buildYear != null && !((buildYear >= 1300 && buildYear <= 1500) || (buildYear >= 1885 && buildYear <= 2200))) {
      msg('سال ساخت معتبر نیست.');
      return;
    }

    setState(() => busy = true);
    try {
      final body = <String, dynamic>{
        'nickname': nick.text.trim(),
        'make': brand,
        'model': selectedModel,
        'current_odometer_km': odometer,
        'fuel_type': fuel,
        'transmission': transmission == 'cvt' ? 'CVT' : transmission == 'amt' ? 'AMT' : transmission,
      };
      if (buildYear != null) body['year'] = buildYear;
      await widget.api.post('vehicles', body);
      if (mounted) Navigator.pop(context, true);
    } catch (e) {
      msg(e.toString().replaceFirst('Exception: ', ''));
    } finally {
      if (mounted) setState(() => busy = false);
    }
  }

  @override
  void dispose() {
    nick.dispose(); make.dispose(); model.dispose(); year.dispose(); odo.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    final fields = <Widget>[
      const Text('مشخصات خودرو', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
      const SizedBox(height: 20),
      TextField(controller: nick, decoration: deco('نام دلخواه خودرو', Icons.label_outline)),
      const SizedBox(height: 14),
      searchableField(
        controller: make,
        label: 'برند',
        icon: Icons.directions_car,
        options: brandOptions,
        onChanged: (_) => setState(() {
          model.clear();
        }),
        onSelected: (_) => setState(() => model.clear()),
      ),
      const SizedBox(height: 14),
      searchableField(
        controller: model,
        label: make.text.trim().isEmpty ? 'مدل' : 'مدل ${make.text.trim()}',
        icon: Icons.car_repair,
        options: modelOptions,
        onChanged: (_) {},
      ),
      const SizedBox(height: 14),
      TextField(controller: year, keyboardType: TextInputType.number, decoration: deco('سال ساخت', Icons.calendar_today_outlined)),
      const SizedBox(height: 14),
      TextField(
        controller: odo,
        keyboardType: TextInputType.number,
        onChanged: (v) {
          final raw = normalizeDigits(v).replaceAll(RegExp(r'[\\s,،٬]'), '');
          final f = raw.replaceAllMapped(RegExp(r'(?<!^)(?=(\\d{3})+$)'), (_) => ',');
          if (f != v) odo.value = odo.value.copyWith(text: f, selection: TextSelection.collapsed(offset: f.length));
        },
        decoration: deco('کیلومتر فعلی', Icons.speed),
      ),
      const SizedBox(height: 14),
      const Divider(height: 34, thickness: 1),
      const Padding(padding: EdgeInsets.only(bottom: 12), child: Align(alignment: Alignment.centerRight, child: Text('مشخصات فنی', style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold)))),
      Directionality(
        textDirection: TextDirection.rtl,
        child: DropdownButtonFormField<String>(
          value: transmission,
          isExpanded: true,
          alignment: Alignment.centerRight,
          decoration: deco('مدل گیربکس', Icons.settings_outlined),
          items: const [
            DropdownMenuItem(value: 'manual', child: Align(alignment: Alignment.centerRight, child: Text('دستی'))),
            DropdownMenuItem(value: 'automatic', child: Align(alignment: Alignment.centerRight, child: Text('اتوماتیک'))),
            DropdownMenuItem(value: 'cvt', child: Align(alignment: Alignment.centerRight, child: Text('CVT'))),
            DropdownMenuItem(value: 'amt', child: Align(alignment: Alignment.centerRight, child: Text('AMT'))),
            DropdownMenuItem(value: 'other', child: Align(alignment: Alignment.centerRight, child: Text('سایر'))),
          ],
          onChanged: (v) { if (v != null) setState(() => transmission = v); },
        ),
      ),
      const SizedBox(height: 14),
      DropdownButtonFormField<String>(
        value: fuel,
        isExpanded: true,
        alignment: Alignment.centerRight,
        decoration: deco('نوع سوخت', Icons.local_gas_station_outlined),
        items: const [
          DropdownMenuItem(value: 'petrol', child: Align(alignment: Alignment.centerRight, child: Text('بنزین'))),
          DropdownMenuItem(value: 'diesel', child: Align(alignment: Alignment.centerRight, child: Text('دیزل'))),
          DropdownMenuItem(value: 'hybrid', child: Align(alignment: Alignment.centerRight, child: Text('هیبریدی'))),
          DropdownMenuItem(value: 'electric', child: Align(alignment: Alignment.centerRight, child: Text('برقی'))),
          DropdownMenuItem(value: 'lpg', child: Align(alignment: Alignment.centerRight, child: Text('LPG'))),
          DropdownMenuItem(value: 'cng', child: Align(alignment: Alignment.centerRight, child: Text('CNG'))),
          DropdownMenuItem(value: 'other', child: Align(alignment: Alignment.centerRight, child: Text('سایر'))),
        ],
        onChanged: (v) { if (v != null) setState(() => fuel = v); },
      ),
      const SizedBox(height: 24),
      SizedBox(height: 52, child: FilledButton.icon(onPressed: busy ? null : save, icon: const Icon(Icons.save), label: Text(busy ? 'در حال ذخیره...' : 'ثبت خودرو'))),
    ];
    return Directionality(textDirection: TextDirection.rtl, child: Scaffold(appBar: AppBar(title: const Text('افزودن خودرو')), body: ListView(padding: const EdgeInsets.all(20), children: fields)));
  }
}

'''

          s, n = re.subn(r'class AddVehicle extends StatefulWidget \{.*?(?=class RecordPage extends StatefulWidget \{)', new_add_vehicle, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('AddVehicle replacement failed')
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Set Flutter base href placeholder
        run: sed -i 's|<base href="[^"]*">|<base href="$FLUTTER_BASE_HREF">|' web/index.html
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - name: Build Flutter Web
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL="https://api-khodro.mtnikmaram.ir/api/v1"
        working-directory: mobile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
