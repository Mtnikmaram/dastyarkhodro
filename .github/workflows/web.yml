name: Build and deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/lib/main.dart')
          s = p.read_text()
          replacements = [
          ('''import 'package:flutter/material.dart';''', '''import 'package:flutter/material.dart';\nimport 'car_catalog.dart';'''),
          ('''  return out.toString();\n}\n\nString fuelName''', '''  return out.toString();\n}\n\nint? parseFlexibleInt(String value) {\n  final normalized = normalizeDigits(value).replaceAll(RegExp(r'[\\s,،٬]'), '').trim();\n  return int.tryParse(normalized);\n}\n\nWidget vehicleSearchField({required TextEditingController controller, required String label, required IconData icon, required List<String> Function(String) optionsBuilder, void Function(String)? onChanged, void Function(String)? onSelected}) {\n  return Autocomplete<String>(\n    textEditingController: controller,\n    optionsBuilder: (value) => optionsBuilder(value.text),\n    onSelected: (value) { controller.text = value; controller.selection = TextSelection.collapsed(offset: value.length); onSelected?.call(value); },\n    fieldViewBuilder: (context, textController, focusNode, onFieldSubmitted) => TextField(controller: textController, focusNode: focusNode, textDirection: TextDirection.rtl, onChanged: onChanged, decoration: deco(label, icon).copyWith(suffixIcon: const Icon(Icons.search))),\n  );\n}\n\nString fuelName'''),
          ('''  String fuel = 'petrol';\n  bool busy = false;''', '''  String fuel = 'petrol';\n  String transmission = 'manual';\n  bool busy = false;'''),
          ('''    final odometer = int.tryParse(normalizeDigits(odo.text.trim()));\n    final normalizedYear = normalizeDigits(year.text.trim());\n    final buildYear = int.tryParse(normalizedYear);\n    if (nick.text.trim().isEmpty || make.text.trim().isEmpty || model.text.trim().isEmpty || odometer == null) { msg('نام خودرو، برند، مدل و کیلومتر الزامی است.'); return; }\n    if (normalizedYear.isNotEmpty && (buildYear == null || (buildYear < 1300 || (buildYear > 1500 && buildYear < 1885)) || buildYear > 2200)) { msg('سال ساخت معتبر نیست.'); return; }''', '''    final odometer = parseFlexibleInt(odo.text);\n    final buildYear = parseFlexibleInt(year.text);\n    if (nick.text.trim().isEmpty || make.text.trim().isEmpty || model.text.trim().isEmpty || odometer == null) { msg('نام خودرو، برند، مدل و کیلومتر الزامی است.'); return; }\n    if (year.text.trim().isNotEmpty && buildYear == null) { msg('سال ساخت را به صورت عدد وارد کن.'); return; }\n    if (buildYear != null && !((buildYear >= 1300 && buildYear <= 1500) || (buildYear >= 1885 && buildYear <= 2200))) { msg('سال ساخت معتبر نیست.'); return; }'''),
          ('''current_odometer_km': odometer, 'fuel_type': fuel};''', '''current_odometer_km': odometer, 'fuel_type': fuel, 'transmission': transmission == 'cvt' ? 'CVT' : transmission == 'amt' ? 'AMT' : transmission};'''),
          ('''      TextField(controller: make, decoration: deco('برند', Icons.directions_car)),''', '''      vehicleSearchField(controller: make, label: 'برند', icon: Icons.directions_car, optionsBuilder: (q) { final x = q.trim().toLowerCase(); final all = catalogBrands(); return x.isEmpty ? all : all.where((b) => b.toLowerCase().contains(x)).toList(); }, onChanged: (_) { setState(() => model.clear()); }, onSelected: (_) { setState(() => model.clear()); }),'''),
          ('''      TextField(controller: model, decoration: deco('مدل', Icons.car_repair)),''', '''      vehicleSearchField(controller: model, label: 'مدل', icon: Icons.car_repair, optionsBuilder: (q) { final x = q.trim().toLowerCase(); final all = catalogModelsFor(make.text.trim()); return x.isEmpty ? all : all.where((m) => m.toLowerCase().contains(x)).toList(); }),'''),
          ('''      TextField(controller: odo, keyboardType: TextInputType.number, decoration: deco('کیلومتر فعلی', Icons.speed)), const SizedBox(height: 14),\n      DropdownButtonFormField<String>(value: fuel,''', '''      TextField(controller: odo, keyboardType: TextInputType.number, onChanged: (v) { final raw = normalizeDigits(v).replaceAll(RegExp(r'[\\s,،٬]'), ''); final f = raw.replaceAllMapped(RegExp(r'(?<!^)(?=(\\d{3})+$)'), (_) => ','); if (f != v) odo.value = odo.value.copyWith(text: f, selection: TextSelection.collapsed(offset: f.length)); }, decoration: deco('کیلومتر فعلی', Icons.speed)), const SizedBox(height: 14),\n      const Divider(height: 34, thickness: 1),\n      const Padding(padding: EdgeInsets.only(bottom: 12), child: Align(alignment: Alignment.centerRight, child: Text('مشخصات فنی', style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold)))),\n      Directionality(textDirection: TextDirection.rtl, child: DropdownButtonFormField<String>(value: transmission, isExpanded: true, alignment: Alignment.centerRight, decoration: deco('مدل گیربکس', Icons.settings_outlined), items: const [DropdownMenuItem(value: 'manual', child: Align(alignment: Alignment.centerRight, child: Text('دستی'))), DropdownMenuItem(value: 'automatic', child: Align(alignment: Alignment.centerRight, child: Text('اتوماتیک'))), DropdownMenuItem(value: 'cvt', child: Align(alignment: Alignment.centerRight, child: Text('CVT'))), DropdownMenuItem(value: 'amt', child: Align(alignment: Alignment.centerRight, child: Text('AMT'))), DropdownMenuItem(value: 'other', child: Align(alignment: Alignment.centerRight, child: Text('سایر')))], onChanged: (v) { if (v != null) setState(() => transmission = v); })), const SizedBox(height: 14),\n      DropdownButtonFormField<String>(value: fuel,'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Patch target not found: ' + old[:90])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Set Flutter base href placeholder
        run: sed -i 's|<base href="[^"]*">|<base href="$FLUTTER_BASE_HREF">|' web/index.html
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - name: Build Flutter Web
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL="https://api-khodro.mtnikmaram.ir/api/v1"
        working-directory: mobile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
