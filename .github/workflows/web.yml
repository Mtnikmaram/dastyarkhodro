name: Build and deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/lib/main.dart')
          s = p.read_text()
          replacements = [
          ('''import 'package:flutter/material.dart';''', '''import 'package:flutter/material.dart';\nimport 'car_catalog.dart';'''),
          ('''  return out.toString();\n}\n\nString fuelName''', '''  return out.toString();\n}\n\nint? parseFlexibleInt(String value) {\n  final normalized = normalizeDigits(value).replaceAll(RegExp(r'[\\s,،٬]'), '').trim();\n  return int.tryParse(normalized);\n}\n\nString _two(int value) => value.toString().padLeft(2, '0');\n\nString gregorianToJalali(DateTime date) {\n  int gy = date.year, gm = date.month, gd = date.day;\n  final gdm = [0,31,28,31,30,31,30,31,31,30,31,30,31];\n  final gy2 = gy + 1;\n  int days = 355666 + 365 * gy + ((gy2 + 3) ~/ 4) - ((gy2 + 99) ~/ 100) + ((gy2 + 399) ~/ 400) + gd;\n  for (int i = 1; i < gm; i++) days += gdm[i];\n  if (gm > 2 && ((gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0)) days += 1;\n  int jy = -1595 + 33 * (days ~/ 12053);\n  days %= 12053;\n  jy += 4 * (days ~/ 1461);\n  days %= 1461;\n  if (days > 365) { jy += (days - 1) ~/ 365; days = (days - 1) % 365; }\n  final int jm = days < 186 ? 1 + days ~/ 31 : 7 + (days - 186) ~/ 30;\n  final int jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);\n  return '[jy/\${_two(jm)}/\${_two(jd)}';\n}\n\nDateTime? jalaliToGregorian(String value) {\n  final parts = normalizeDigits(value).replaceAll('\\', '/').replaceAll('-', '/').split('/');\n  if (parts.length != 3) return null;\n  final jy = int.tryParse(parts[0]);\n  final jm = int.tryParse(parts[1]);\n  final jd = int.tryParse(parts[2]);\n  if (jy == null || jm == null || jd == null || jy < 1300 || jy > 1500 || jm < 1 || jm > 12 || jd < 1 || jd > 31) return null;\n  int gy = jy + 621;\n  final jy2 = jy - 979;\n  int days = 365 * jy2 + (jy2 ~/ 33) * 8 + ((jy2 % 33) + 3) ~/ 4;\n  if (jm <= 6) { days += (jm - 1) * 31 + jd - 1; } else { days += 186 + (jm - 7) * 30 + jd - 1; }\n  days += 79;\n  gy += 400 * (days ~/ 146097);\n  days %= 146097;\n  bool leap = true;\n  if (days >= 36525) { days--; gy += 100 * (days ~/ 36524); days %= 36524; if (days >= 365) days++; else leap = false; }\n  gy += 4 * (days ~/ 1461);\n  days %= 1461;\n  if (days >= 366) { leap = false; days--; gy += days ~/ 365; days %= 365; }\n  final gdm = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];\n  int gm = 1;\n  while (gm <= 12 && days >= gdm[gm - 1]) { days -= gdm[gm - 1]; gm++; }\n  if (gm > 12) return null;\n  return DateTime(gy, gm, days + 1);\n}\n\nString jalaliDisplayDate(dynamic value) {\n  final raw = value?.toString() ?? '';\n  final parts = raw.split(RegExp(r'[T ]'))[0].split('-');\n  if (parts.length != 3) return raw;\n  final gy = int.tryParse(parts[0]), gm = int.tryParse(parts[1]), gd = int.tryParse(parts[2]);\n  if (gy == null || gm == null || gd == null) return raw;\n  return gregorianToJalali(DateTime(gy, gm, gd));\n}\n\nString fuelName'''),
          ('''${x['service_date']} • ${money(x['cost'])} ریال''', '''${jalaliDisplayDate(x['service_date'])} • ${money(x['cost'])} ریال'''),
          ('''${x['expense_date']} • ${money(x['amount'])} ریال''', '''${jalaliDisplayDate(x['expense_date'])} • ${money(x['amount'])} ریال'''),
          ('''${service ? x['service_date'] : x['expense_date']} • ${x['odometer_km'] ?? '-'} کیلومتر''', '''${service ? jalaliDisplayDate(x['service_date']) : jalaliDisplayDate(x['expense_date'])} • ${x['odometer_km'] ?? '-'} کیلومتر'''),
          ('''  @override void initState() { super.initState(); date.text = DateTime.now().toIso8601String().substring(0, 10); odo.text = widget.odometer.toString(); category = widget.service ? 'oil' : 'fuel'; }''', '''  @override void initState() { super.initState(); date.text = gregorianToJalali(DateTime.now()); odo.text = money(widget.odometer); category = widget.service ? 'oil' : 'fuel'; }'''),
          ('''    final odometer = int.tryParse(odo.text.trim()) ?? 0;\n    final value = double.tryParse(amount.text.replaceAll(',', '').trim());\n    if (title.text.trim().isEmpty || value == null) { msg('عنوان و مبلغ را کامل وارد کن.'); return; }''', '''    final odometer = parseFlexibleInt(odo.text) ?? 0;\n    final value = double.tryParse(normalizeDigits(amount.text).replaceAll(RegExp(r'[\\s,،٬]'), '').trim());\n    final apiDate = jalaliToGregorian(date.text.trim());\n    if (title.text.trim().isEmpty || value == null) { msg('عنوان و مبلغ را کامل وارد کن.'); return; }\n    if (apiDate == null) { msg('تاریخ شمسی معتبر وارد کن؛ مثال: ۱۴۰۵/۰۸/۰۹'); return; }\n    final isoDate = '${apiDate.year.toString().padLeft(4, '0')}-${_two(apiDate.month)}-${_two(apiDate.day)}';'''),
          (''''service_date': date.text.trim(),''', ''''service_date': isoDate,'''),
          (''''expense_date': date.text.trim(),''', ''''expense_date': isoDate,'''),
          ('''TextField(controller: amount, keyboardType: TextInputType.number, decoration: deco('مبلغ (ریال)', Icons.currency_exchange)), const SizedBox(height: 14),\n      TextField(controller: date, decoration: deco('تاریخ YYYY-MM-DD', Icons.calendar_today)), const SizedBox(height: 14), TextField(controller: odo, keyboardType: TextInputType.number, decoration: deco('کیلومتر', Icons.speed)),''', '''TextField(controller: amount, keyboardType: TextInputType.number, onChanged: (v) { final raw = normalizeDigits(v).replaceAll(RegExp(r'[\\s,،٬]'), ''); final f = raw.replaceAllMapped(RegExp(r'(?<!^)(?=(\\d{3})+$)'), (_) => ','); if (f != v) amount.value = amount.value.copyWith(text: f, selection: TextSelection.collapsed(offset: f.length)); }, decoration: deco('مبلغ (ریال)', Icons.currency_exchange)), const SizedBox(height: 14),\n      TextField(controller: date, keyboardType: TextInputType.datetime, decoration: deco('تاریخ شمسی', Icons.calendar_today)), const SizedBox(height: 14), TextField(controller: odo, keyboardType: TextInputType.number, onChanged: (v) { final raw = normalizeDigits(v).replaceAll(RegExp(r'[\\s,،٬]'), ''); final f = raw.replaceAllMapped(RegExp(r'(?<!^)(?=(\\d{3})+$)'), (_) => ','); if (f != v) odo.value = odo.value.copyWith(text: f, selection: TextSelection.collapsed(offset: f.length)); }, decoration: deco('کیلومتر', Icons.speed)),'''),
          ('''      DropdownButtonFormField<String>(value: category, decoration: deco('دسته‌بندی', Icons.category_outlined), items: categories.entries.map((e) => DropdownMenuItem<String>(value: e.key, child: Text(e.value))).toList(), onChanged: (v) { if (v != null) setState(() => category = v); }),''', '''      Directionality(textDirection: TextDirection.rtl, child: DropdownButtonFormField<String>(value: category, isExpanded: true, alignment: Alignment.centerRight, decoration: deco('دسته‌بندی', Icons.category_outlined), items: categories.entries.map((e) => DropdownMenuItem<String>(value: e.key, child: Align(alignment: Alignment.centerRight, child: Text(e.value)))).toList(), onChanged: (v) { if (v != null) setState(() => category = v); })),'''),
          ('''      DropdownButtonFormField<String>(value: fuel,''', '''      Directionality(textDirection: TextDirection.rtl, child: DropdownButtonFormField<String>(value: fuel, isExpanded: true, alignment: Alignment.centerRight,'''),
          ('''      const SizedBox(height: 24), SizedBox(height: 52, child: FilledButton.icon''', '''      const SizedBox(height: 24), SizedBox(height: 52, child: FilledButton.icon'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Patch target not found: ' + old[:100])
              s = s.replace(old, new, 1)
          # Keep every record page dropdown item visually RTL without changing the backend contract.
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Set Flutter base href placeholder
        run: sed -i 's|<base href="[^"]*">|<base href="$FLUTTER_BASE_HREF">|' web/index.html
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - name: Build Flutter Web
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL="https://api-khodro.mtnikmaram.ir/api/v1"
        working-directory: mobile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
