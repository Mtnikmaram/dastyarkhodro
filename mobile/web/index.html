<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="دستیار خودرو">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>دستیار خودرو</title>
</head>
<body>
  <script>
    // Remove registrations and cached Flutter assets left by older deployments.
    // Load Flutter only after cleanup so stale service workers cannot serve a
    // mismatched bootstrap or main.dart.js bundle.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const hadController = !!navigator.serviceWorker.controller;
          if (registrations.length) {
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }
          if (hadController && sessionStorage.getItem('dastyar-khodro-sw-cleaned') !== '1') {
            sessionStorage.setItem('dastyar-khodro-sw-cleaned', '1');
            location.reload();
            return;
          }
        }
      } catch (error) {
        console.warn('Flutter cache cleanup skipped:', error);
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
